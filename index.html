<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 资讯日报</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950; --orange: #d29922; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans SC',sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
  .container { max-width: 720px; margin: 0 auto; padding: 40px 20px; text-align: center; }
  header { padding: 60px 0 40px; }
  header h1 { font-size: 2.5em; background: linear-gradient(135deg, var(--accent), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  header p { color: var(--dim); margin-top: 12px; font-size: 1.1em; }
  .latest { background: var(--card); border: 1px solid var(--accent); border-radius: 12px; padding: 30px; margin-bottom: 30px; }
  .latest h2 { font-size: 1.3em; margin-bottom: 16px; color: var(--accent); }
  .latest .btn { display: inline-block; padding: 12px 32px; background: var(--accent); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1em; }
  .latest .btn:hover { opacity: 0.85; }
  .archive-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px; }
  .archive-section h2 { font-size: 1.2em; margin-bottom: 16px; }
  .archive-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .archive-grid a { display: inline-block; padding: 8px 16px; background: #21262d; border: 1px solid var(--border); border-radius: 8px; color: var(--text); text-decoration: none; font-size: 0.9em; }
  .archive-grid a:hover { border-color: var(--accent); color: var(--accent); background: #1f6feb22; }
  .footer { margin-top: 40px; color: var(--dim); font-size: 0.85em; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📡 AI 资讯日报</h1>
    <p>每天自动收集国内外最新 AI 技术动态</p>
  </header>

  <div class="latest">
    <h2>📰 最新一期</h2>
    <p style="color: var(--dim); margin-bottom: 20px;">2026 年 5 月 5 日 · 共 23 条资讯</p>
    <a href="2026-05-05.html" class="btn">📖 阅读今日简报</a>
  </div>

  <div class="archive-section">
    <h2>📚 历史存档</h2>
    <div class="archive-grid">
      <a href="2026-05-05.html">2026-05-05</a>
      <a href="2026-05-03.html">2026-05-03</a>
      <a href="2026-05-02.html">2026-05-02</a>
      <a href="2026-05-01.html">2026-05-01</a>
      <a href="2026-04-30.html">2026-04-30</a>
      <a href="2026-04-29.html">2026-04-29</a>
    </div>
  </div>

  <div class="footer">
    <p>GitHub: <a href="https://github.com/ikongsir/ai-news-daily" style="color: var(--accent);">ikongsir/ai-news-daily</a></p>
    <p style="margin-top:4px">💡 数据来源实时采集，仅供参考</p>
  </div>
</div>
</body>
</html>
